# The pr-review template repo's gates: CR conformance + drift guards against
# the kernel at the pinned tag (the vendored plugins and the task text must
# match the image the fleet actually runs — the #606 pattern, new address).
name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  KERNEL_TAG: "v1.9.2"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout the kernel at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: tibrezus/harmostes
          ref: ${{ env.KERNEL_TAG }}
          path: kernel
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install the envtest control plane
        run: |
          sudo mkdir -p /usr/local/kubebuilder/bin && sudo chown -R "$USER" /usr/local/kubebuilder
          curl -sL --retry 5 --retry-all-errors "https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.31.0/envtest-v1.31.0-linux-amd64.tar.gz" | tar -xz -C /tmp
          mv /tmp/controller-tools/envtest/* /usr/local/kubebuilder/bin/
      - name: CR conformance (the shared harness)
        run: |
          git clone --depth 1 https://github.com/tibrezus/harmostes-config /tmp/config
          cd /tmp/config && go mod download 2>/dev/null || true
          go run ./hack/conformance.go -crds "$GITHUB_WORKSPACE/kernel/chart/crds" -objects "$GITHUB_WORKSPACE"

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout the kernel at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: tibrezus/harmostes
          ref: ${{ env.KERNEL_TAG }}
          path: kernel
      - name: vendored plugins match the kernel's image content
        run: |
          set -euo pipefail
          fail=0
          for pair in "plugins/pr-review.sh:plugins/pr-review/pr-review.sh" "plugins/workspace.sh:plugins/workspace/workspace.sh" "plugins/git-host.sh:plugins/lib/git-host.sh"; do
            mine="${pair%%:*}"; theirs="kernel/${pair##*:}"
            if ! diff -q "$mine" "$theirs" >/dev/null 2>&1; then
              echo "::error::DRIFT: $mine differs from $theirs — sync the vendored copy (or bump KERNEL_TAG after a kernel release)"; fail=1
            fi
          done
          # (phase 4, #792: the chart no longer ships the task text — its
          # byte-guard vs the chart retired; the task text's CONTRACT guards
          # live in the task-contract job below, and its history is this
          # repo's own.)
          [ "$fail" = 0 ] && echo "drift guards: all vendored plugins match the kernel ✓" || exit 1

  # Phase 4 (#792): the task text's contract guards moved here with the
  # text. Two legs: (a) the ported kernel suite — the text vs the KERNEL's
  # plugins/gate/sweep/extension at KERNEL_TAG (the pair stays pinned);
  # (b) the pillar/skill parity — the text vs the SERVED skill at the
  # kernel-pinned agents rev (skills.rev), the #404/#680 check's new home.
  task-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout the kernel at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: tibrezus/harmostes
          ref: ${{ env.KERNEL_TAG }}
          path: kernel
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: kernel/go.mod
      - name: task-text ↔ kernel contract suite
        run: |
          HARMOSTES_KERNEL_DIR="$GITHUB_WORKSPACE/kernel" go test ./contract/ -v
      - name: pillar/skill parity (the served skill at the pinned agents rev)
        run: |
          set -euo pipefail
          REV="$(git -C kernel rev-parse HEAD:.agents)"
          git clone -q --no-checkout https://github.com/tibrezus/agents "$GITHUB_WORKSPACE/agents"
          git -C "$GITHUB_WORKSPACE/agents" checkout -q "$REV"
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import os, re, sys
          ws = sys.argv[1]
          fail = []
          def check(cond, msg):
              if not cond: fail.append(msg)
          _words = {"one":1,"two":2,"three":3,"four":4,"five":5,"six":6,"seven":7,"eight":8,"nine":9,"ten":10}
          def _num(w): return int(w) if w.isdigit() else _words.get(w.lower())
          def _pillar_count(text):
              for pat in (r"[Cc]over(?:s|ing)? (\w+) CI quality pillars", r"(?:across|over) (\w+)(?: CI)? quality pillars"):
                  for m in re.findall(pat, text):
                      n = _num(m)
                      if n is not None: return n
              return None
          def _header_count(text):
              m = re.search(r"## The (\w+) pillars", text)
              return _num(m.group(1)) if m else None
          skill = open(f"{ws}/agents/skills/pr-review/SKILL.md").read()
          prompt = open(f"{ws}/tasks/pr-review.txt").read()
          n_skill, n_header = _pillar_count(skill), _header_count(skill)
          if n_skill is None:
              check(False, "SKILL states no extractable pillar count — fix the skill upstream and re-pin")
          elif n_header is None:
              check(False, "SKILL has no '## The N pillars' header")
          elif n_skill != n_header:
              check(False, f"SKILL inconsistent: description {n_skill} vs header {n_header}")
          for marker, why in (
              ("skill provides the", "prompt must defer methodology to the loaded skill"),
              ("findings", "prompt lost the ledger findings[] contract"),
              ("thread_ref", "prompt lost the posted-thread ledger marker"),
          ):
              check(marker in prompt, f"task text lost a contract marker: {why}")
          if fail:
              print("PARITY FAILED:", *fail, sep="\n  - ", file=sys.stderr); sys.exit(1)
          print(f"pillar/skill parity green (skill pillars: {n_skill})")
          PY
